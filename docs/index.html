<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inospace · Leads Performance</title>
<style>
  html{color-scheme:light}
  :root{
    --bg:#eceef0; --card:#ffffff; --ink:#14161a; --muted:#727a86;
    --line:#e6e9ee; --red:#e11b22; --red-d:#b3151b; --black:#0f1114;
    --red-tint:rgba(225,27,34,.08);
    --good:#2f9e44; --amber:#e8770c; --chip:#f2f4f7;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px 64px}

  /* single light top bar: brand + tabs + print — matches sitelink-analytics-dashboard */
  .topbar{position:sticky;top:0;z-index:20;background:#f7f7f7;
    border-bottom:1px solid var(--line);width:100%;margin-bottom:22px}
  .topin{max-width:1200px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .logo-svg{height:26px;width:auto;flex:none;display:block}
  .brand .div{width:1px;height:20px;background:var(--line)}
  .brand .ctx{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .switch{display:flex;gap:7px;flex-wrap:wrap}
  .switch button{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .switch button:hover{border-color:#c4cdd8}
  .switch button.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 8px rgba(225,27,34,.28)}
  .btn-print.active{background:var(--ink);border-color:var(--ink);color:#fff}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  .sort-arrow{margin-left:4px;font-size:10px}
  .sort-arrow.inactive{opacity:.35}
  .spacer{flex:1 1 auto}
  .btn-print{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;
    border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn-print:hover{border-color:#c4cdd8}
  .updated{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3}
  .period{font-size:12px;color:var(--muted);margin:16px 2px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h2{font-size:15px;margin:0 0 3px;font-weight:750}
  .panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 16px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);
    position:relative;overflow:hidden}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);opacity:.85}
  .tile.g::before{background:var(--good)} .tile.a::before{background:var(--amber)} .tile.n::before{background:#aeb6c2}
  .tile .lab{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .tile .val{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.6px}
  .tile .sub{font-size:12px;color:var(--muted);margin-top:3px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:#fafbfc}

  .insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:2px 0 20px}
  .ins{background:var(--card);border:1px solid var(--line);border-left:4px solid #aeb6c2;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .ins.bad{border-left-color:var(--red)} .ins.warn{border-left-color:var(--amber)} .ins.good{border-left-color:var(--good)}
  .ins .ih{font-weight:800;font-size:14px;letter-spacing:-.2px} .ins .is{font-size:12px;color:var(--muted);margin-top:3px}

  .note{font-size:12.5px;color:var(--muted);background:#f8f9fb;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
  .error{color:var(--red-d);border:1px solid var(--red);background:var(--red-tint);border-radius:var(--radius);padding:16px 18px}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;text-align:center;line-height:1.6}
  .loading{padding:70px;text-align:center;color:var(--muted)}

  @media print{
    .topbar{position:static}
    .switch,.btn-print,.spacer{display:none}
    body{background:#fff}
    .panel,.tile{box-shadow:none;border:1px solid #d8dde4;break-inside:avoid}
    .wrap{max-width:none}
  }
</style>
</head>

<script>
let DATA = null;
let ACTIVE_SITE = null;
let VIEW_MODE = 'site'; // 'site' | 'criteria'
let SORT_COL = 'month';
let SORT_DIR = 'desc'; // most recent month first by default

function bandClass(label) {
  if (!label) return 'n';
  const bad = ['Concerning', 'Below Target'];
  return bad.some(b => label.startsWith(b)) ? '' : 'g';
}

function sortHistory(col) {
  if (SORT_COL === col) {
    SORT_DIR = SORT_DIR === 'asc' ? 'desc' : 'asc';
  } else {
    SORT_COL = col;
    SORT_DIR = 'asc';
  }
  render();
}

function sortArrow(col) {
  if (SORT_COL !== col) return '<span class="sort-arrow inactive">↕</span>';
  return SORT_DIR === 'asc' ? '<span class="sort-arrow">↑</span>' : '<span class="sort-arrow">↓</span>';
}

function sortedHistory(hist) {
  const rows = hist.slice();
  const dir = SORT_DIR === 'asc' ? 1 : -1;
  rows.sort((a, b) => {
    let av = a[SORT_COL], bv = b[SORT_COL];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;  // nulls always sort last, regardless of direction
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
  return rows;
}

function buildSwitch() {
  const sw = document.getElementById('switch');
  const codes = Object.keys(DATA.sites);
  sw.innerHTML = codes.map(code => {
    const site = DATA.sites[code];
    return `<button data-v="${code}" class="${VIEW_MODE === 'site' && code === ACTIVE_SITE ? 'active' : ''}">${site.name}</button>`;
  }).join('');
  sw.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      VIEW_MODE = 'site';
      ACTIVE_SITE = btn.dataset.v;
      sw.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === btn));
      document.getElementById('btn-criteria').classList.remove('active');
      render();
    };
  });
}

function toggleCriteria() {
  VIEW_MODE = VIEW_MODE === 'criteria' ? 'site' : 'criteria';
  document.getElementById('btn-criteria').classList.toggle('active', VIEW_MODE === 'criteria');
  document.querySelectorAll('#switch button').forEach(x => x.classList.toggle('active', VIEW_MODE === 'site' && x.dataset.v === ACTIVE_SITE));
  render();
}

function renderCriteria() {
  const bands = DATA.bands_reference || {};
  const thresholds = DATA.diagnostic_thresholds || {};
  const labels = {
    genuine_enquiries: 'Reservations (= Genuine Enquiries — vetted, confirmed intent to rent) per month. "Leads" (all inquiries) has no band criteria yet.',
    conversion_rate: 'Conversion Rate',
    move_ins: 'Move-ins (per month)',
    occupancy_sqm: 'Occupancy % (sqm, all area) — same thresholds also used for Occupancy % (units, rentable units only); the two are no longer on the same basis, only the same band cutoffs',
  };
  const fmtThreshold = (key, v) => {
    if (key === 'conversion_rate' || key === 'occupancy_sqm') return (v * 100).toFixed(0) + '%';
    return v;
  };
  let html = '<div class="panel"><h2>KPI band criteria</h2><p class="hint">' +
    (DATA.bands_note || 'Same KPI bands apply to every site.') + '</p>';
  Object.entries(bands).forEach(([key, rows]) => {
    html += `<h3 style="margin:16px 0 6px;font-size:13px">${labels[key] || key}</h3>`;
    html += '<table><thead><tr><th>Threshold</th><th>Band</th></tr></thead><tbody>';
    rows.forEach(([threshold, label], i) => {
      const nextThreshold = rows[i + 1] ? fmtThreshold(key, rows[i + 1][0]) : null;
      const rangeText = nextThreshold ? `≥ ${fmtThreshold(key, threshold)} and < ${nextThreshold}` : `≥ ${fmtThreshold(key, threshold)}`;
      html += `<tr><td>${rangeText}</td><td>${label}</td></tr>`;
    });
    html += '</tbody></table>';
  });
  if (Object.keys(thresholds).length) {
    html += '<h3 style="margin:16px 0 6px;font-size:13px">Diagnostic flag triggers</h3>';
    html += `<div class="note">
      "Insufficient demand generation" fires when Genuine Enquiries is between ${thresholds.low_demand_min} and ${thresholds.low_demand_max}.<br>
      "Possible price / product / sales issue" fires when Genuine Enquiries is between ${thresholds.price_issue_enq_min} and ${thresholds.price_issue_enq_max} but Move-ins is below ${thresholds.price_issue_moveins_max}.
    </div>`;
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function render() {
  if (VIEW_MODE === 'criteria') { renderCriteria(); return; }
  const el = document.getElementById('app');
  const site = DATA.sites[ACTIVE_SITE];
  const cur = site.current_month || {};

  const cards = [
    ['Leads', cur.leads, null],
    ['Monthly Target (units)', cur.monthly_target_units != null ? cur.monthly_target_units : '—', null],
    ['Conversion Rate', cur.conversion_rate != null ? (cur.conversion_rate * 100).toFixed(1) + '%' : '—', cur.bands && cur.bands.conversion_rate],
    ['Move-ins', cur.move_ins, cur.bands && cur.bands.move_ins],
    ['Occupancy % (sqm)', cur.occupancy_sqm_pct != null ? (cur.occupancy_sqm_pct * 100).toFixed(1) + '%' : '—', cur.bands && cur.bands.occupancy_sqm],
    ['Occupancy % (units)', cur.occupancy_units_pct != null ? (cur.occupancy_units_pct * 100).toFixed(1) + '%' : '—', cur.bands && cur.bands.occupancy_units],
  ];

  const subText = (label, band) => {
    if (label === 'Reservations') {
      return `Genuine Enquiries${band ? ' · ' + band : ''}`;
    }
    if (label === 'Occupancy % (sqm)') {
      return `${band || ''}${band ? ' · ' : ''}rentable units only`;
    }
    if (label === 'Occupancy % (units)') {
      return `${band || ''}${band ? ' · ' : ''}rentable units only`;
    }
    return band || '';
  };

  let html = '<div class="tiles">' + cards.map(([label, value, band]) => `
    <div class="tile ${bandClass(band)}">
      <div class="lab">${label}</div>
      <div class="val">${value != null ? value : '—'}</div>
      <div class="sub">${subText(label, band)}</div>
    </div>
  `).join('') + '</div>';

  if (cur.diagnostic_flags && cur.diagnostic_flags.length) {
    html += '<div class="insights">' + cur.diagnostic_flags.map(f =>
      `<div class="ins bad"><div class="ih">⚠ Flag</div><div class="is">${f}</div></div>`
    ).join('') + '</div>';
  }

  const hist = site.monthly_history || [];
  html += '<div class="panel"><h2>Monthly history</h2><p class="hint">' + site.name + ' — rolling monthly view. Click a column header to sort.</p>';
  if (hist.length) {
    const cols = [
      ['month', 'Month'],
      ['leads', 'Leads'],
      ['genuine_enquiries', 'Reservations'],
      ['conversion_rate', 'Conversion Rate'],
      ['move_ins', 'Move-ins'],
      ['occupancy_sqm_pct', 'Occupancy % (sqm)'],
      ['occupancy_units_pct', 'Occupancy % (units)'],
    ];
    html += '<table><thead><tr>' + cols.map(([key, label]) =>
      `<th class="sortable" onclick="sortHistory('${key}')">${label}${sortArrow(key)}</th>`
    ).join('') + '</tr></thead><tbody>';
    sortedHistory(hist).forEach(m => {
      html += `<tr>
        <td>${m.month || ''}</td>
        <td>${m.leads != null ? m.leads : '—'}</td>
        <td>${m.genuine_enquiries != null ? m.genuine_enquiries : '—'}</td>
        <td>${m.conversion_rate != null ? (m.conversion_rate * 100).toFixed(1) + '%' : '—'}</td>
        <td>${m.move_ins != null ? m.move_ins : '—'}</td>
        <td>${m.occupancy_sqm_pct != null ? (m.occupancy_sqm_pct * 100).toFixed(1) + '%' : '—'}</td>
        <td>${m.occupancy_units_pct != null ? (m.occupancy_units_pct * 100).toFixed(1) + '%' : '—'}</td>
      </tr>`;
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="note">No monthly history yet - this fills in as the daily pipeline accumulates data, ' +
      'or once per-site historical backfill is confirmed possible (see README).</div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

async function load() {
  const el = document.getElementById('app');
  try {
    const res = await fetch('leads_data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    window.DATA = DATA;
    try {
      const tRes = await fetch('targets.json', { cache: 'no-store' });
      if (tRes.ok) {
        window.TARGETS = await tRes.json();
        const curMonthKey = (DATA.run_date || '').slice(0,7);
        Object.keys(DATA.sites || {}).forEach(function(sid){
          const site = DATA.sites[sid];
          const t = window.TARGETS.sites && window.TARGETS.sites[sid];
          const cur = site.current_month;
          if (t && cur) {
            if (cur.occupancy_sqm_pct != null && t.total_sqm && t.rentable_sqm) {
              const occupiedSqm = cur.occupancy_sqm_pct * t.total_sqm;
              cur.occupancy_sqm_pct = Math.round((occupiedSqm / t.rentable_sqm) * 1000) / 1000;
            }
            const mt = t.monthly && t.monthly[curMonthKey];
            cur.monthly_target_units = mt ? mt.occ_units_target : null;
          }
        });
      }
    } catch (eTargets) { /* targets.json optional */ }
  } catch (e) {
    el.innerHTML = '<div class="error">Could not load leads_data.json: ' + e.message +
      '. This file is rebuilt daily by the GitHub Actions workflow - if it is missing, ' +
      'the workflow may not have run yet, or SOURCE_REPO_PAT needs setting.</div>';
    return;
  }
  ACTIVE_SITE = DATA.default_site && DATA.sites[DATA.default_site] ? DATA.default_site : Object.keys(DATA.sites)[0];
  document.getElementById('updated').textContent = 'Updated ' + ((DATA.generated_at || DATA.run_date || '').replace('T', ' ').slice(0, 16));
  document.getElementById('period').textContent = 'Leads and moves are month-to-date; occupancy is as-of run date · ZAR';
  document.getElementById('foot').innerHTML = 'Source: sitelink-analytics-dashboard pipeline (Consolidated Lead Funnel &amp; Move-Ins/Move-Outs) · aggregate figures only.<br>inospace — space that works';
  buildSwitch();
  render();
}
load();
</script>

<style id="obj-style">
.obj-toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;margin-right:8px}
.obj-toggle.active{background:var(--red);border-color:var(--red);color:#fff}
.obj-chip{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}
.obj-chip.good{background:rgba(47,158,68,.12);color:var(--good)}
.obj-chip.bad{background:rgba(232,119,12,.14);color:var(--amber)}
.obj-note{background:var(--chip,#f2f4f7);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin-top:4px}
.obj-note.warn{background:rgba(232,119,12,.08)}
</style>
<script>
(function(){
  function fmtR(n){ return 'R'+Math.round(n).toLocaleString('en-ZA'); }
  function monthKey(dstr){ return (dstr||'').slice(0,7); }
  function nextMonthKey(ym){
    let parts = ym.split('-').map(Number); let y=parts[0]; let m=parts[1];
    m+=1; if(m>12){m=1;y+=1;}
    return y+'-'+String(m).padStart(2,'0');
  }
  function renderObjectives(){
    const root = document.getElementById('obj-root');
    if(!root) return;
    const leadsData = window.DATA, targets = window.TARGETS;
    if(!leadsData || !targets){ root.innerHTML = 'Loading objectives…'; return; }
    const curM = monthKey(leadsData.run_date);
    const nextM = nextMonthKey(curM);
    const siteIds = ['56788','58700','58995'];
    let html = '';
    siteIds.forEach(function(sid){
      const s = leadsData.sites[sid];
      const t = targets.sites[sid];
      if(!s || !t) return;
      const cm = s.current_month;
      const occUnitsRentable = Math.round((cm.occupancy_units_pct||0) * t.rentable_units_current);
      const curTarget = t.monthly[curM];
      const nextTarget = t.monthly[nextM];
      const gap = curTarget ? (occUnitsRentable - curTarget.occ_units_target) : null;
      const statusCls = (gap===null) ? '' : (gap>=0?'good':'bad');
      const statusTxt = (gap===null) ? '' : (gap>=0 ? ('On target — +'+gap+' ahead') : ('Behind by '+Math.abs(gap)));
      const blendedPct = ((occUnitsRentable/t.total_physical_units)*100).toFixed(1);
      const revActual = cm.revenue_actual;
      const revTarget = curTarget ? curTarget.rev_target : null;
      const revGap = (revActual != null && revTarget != null) ? (revActual - revTarget) : null;
      const revStatusCls = (revGap === null) ? '' : (revGap >= 0 ? 'good' : 'bad');
      html += '<div class="panel">'
        + '<h2>'+t.name+(statusTxt?' <span class="obj-chip '+statusCls+'">'+statusTxt+'</span>':'')+'</h2>'
        + '<div class="tiles">'
        + '<div class="tile"><div class="lab">Occupied (rentable)</div><div class="val">'+occUnitsRentable+'/'+t.rentable_units_current+'</div></div>'
        + '<div class="tile"><div class="lab">Of '+t.total_physical_units+' total units</div><div class="val">'+blendedPct+'%</div></div>'
        + '<div class="tile"><div class="lab">Move-ins this month</div><div class="val">'+(cm.move_ins!=null?cm.move_ins:'—')+'</div></div>'
        + (curTarget?('<div class="tile '+statusCls+'"><div class="lab">'+curM+' target</div><div class="val">'+curTarget.occ_units_target+'</div></div>'):'')
        + (nextTarget?('<div class="tile"><div class="lab">'+nextM+' target</div><div class="val">'+nextTarget.occ_units_target+'</div></div>'):'')
        + (revActual != null ? ('<div class="tile '+revStatusCls+'"><div class="lab">Revenue this month</div><div class="val">'+fmtR(revActual)+'</div></div>'+(revTarget!=null?('<div class="tile"><div class="lab">Revenue target</div><div class="val">'+fmtR(revTarget)+'</div></div>'):'')) : '')
        + '</div>'
        + '<div class="obj-note"><b>'+t.quarter_label+'</b> revenue target: '+fmtR(t.quarter_rev_target)+'. '
        + 'FY target by '+t.fy_end+': '+t.fy_end_target.occ_units_target+' units ('+t.fy_end_target.occ_pct_target+'%). '
        + (t.note?t.note:'') + '</div>'
        + (revGap != null ? ('<div class="obj-note'+(revGap>=0?'':' warn')+'">'+(revGap>=0 ? (fmtR(revGap)+' ahead of this month\'s revenue target.') : (fmtR(Math.abs(revGap))+' short of this month\'s revenue target.')) + '</div>') : '')
        + '</div>';
    });
    root.innerHTML = html || 'No objectives data available.';
  }

  function init(){
    const app = document.getElementById('app');
    const foot = document.getElementById('foot');
    const wrap = document.querySelector('.wrap');
    const criteriaBtn = document.getElementById('btn-criteria');
    if(!app || !wrap || !criteriaBtn) { setTimeout(init, 100); return; }

    const objDiv = document.createElement('div');
    objDiv.id = 'objectives';
    objDiv.style.display = 'none';
    objDiv.innerHTML = '<div id="obj-root">Loading objectives…</div>';
    wrap.insertBefore(objDiv, foot || null);

    const toggle = document.createElement('button');
    toggle.id = 'tab-objectives';
    toggle.className = 'obj-toggle';
    toggle.textContent = 'Objectives';
    criteriaBtn.parentNode.insertBefore(toggle, criteriaBtn);

    toggle.addEventListener('click', function(){
      const showing = objDiv.style.display === 'block';
      if(showing){
        objDiv.style.display = 'none'; toggle.classList.remove('active');
        app.style.display = '';
      } else {
        objDiv.style.display = 'block'; toggle.classList.add('active');
        app.style.display = 'none';
        renderObjectives();
      }
    });

    const sw = document.getElementById('switch');
    if(sw){
      sw.addEventListener('click', function(e){
        if(e.target && e.target.tagName === 'BUTTON'){
          objDiv.style.display = 'none'; toggle.classList.remove('active');
          app.style.display = '';
        }
      });
    }

    (async function loadTargetsIfNeeded(){
      if(!window.TARGETS){
        try{
          const r = await fetch('targets.json', {cache:'no-store'});
          if(r.ok) window.TARGETS = await r.json();
        }catch(e){}
      }
    })();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
