name: Update leads dashboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Fetch source repo data
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          SOURCE_REPO_BRANCH: master
        run: python etl/fetch_source_data.py

      - name: TEMP - copy fetched data for inspection
        run: |
          mkdir -p debug
          cp _incoming/data.json debug/data_sample.json
          cp _incoming/history.json debug/history_sample.json

      - name: Build leads-performance view
        run: python etl/build_leads_view.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/data_sample.json debug/history_sample.json
          if [ -f docs/leads_data.json ]; then git add docs/leads_data.json; fi
          git diff --staged --quiet || git commit -m "Update leads_data.json + debug samples [skip ci]"
          git push
